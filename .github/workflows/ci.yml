name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly fuzzing is a release job, not a per-pull-request gate.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, test, spec and demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The window is feature-gated out of the default test build; compile it
      # here so its eframe/X11/Wayland wiring cannot rot unnoticed.
      - run: cargo clippy -p openlight-desktop --all-targets --features gui --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 tools/spec_status.py --check
      - run: tools/demo_trace.sh check

  platform:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # The virtual transport and the target serial module are the portable
      # build. USB (libusb) is exercised by the dedicated job below; raw serial
      # is native on Linux and macOS, and on Windows this job compiles and tests
      # the COM backend. No adapter is present, so the tests cover the path,
      # DCB and registry mapping rather than line timing.
      - name: Workspace tests
        shell: bash
        run: |
          # GitHub runs this shell with -e; turn it off so a failing test run
          # still reaches the annotation step below.
          set +e
          set -o pipefail
          # --no-fail-fast runs every test binary, so one failure does not hide
          # the rest. The annotations name the failing tests: a platform-only
          # failure is otherwise only visible in the raw job log.
          cargo test --workspace --locked --no-default-features --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            lines="$(grep -E "^---- .* stdout ----|panicked at|^error(\[|:)" test.log | head -10)"
            if [ -z "$lines" ]; then
              lines="$(tail -10 test.log)"
            fi
            printf '%s\n' "$lines" | while IFS= read -r line; do
              echo "::error title=cargo test::$line"
            done
          fi
          exit "$status"
      - name: Windows COM lint
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --no-default-features \
            --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            lines="$(grep -E ": (error|warning):" clippy.log | head -10)"
            if [ -z "$lines" ]; then
              lines="$(tail -10 clippy.log)"
            fi
            printf '%s\n' "$lines" | while IFS= read -r line; do
              echo "::error title=windows clippy::$line"
            done
          fi
          exit "$status"
      # The phase demos do not need a device; run their trace diff on every
      # Unix platform. Windows has no bash by default in this job.
      - name: Demo traces
        if: runner.os != 'Windows'
        shell: bash
        run: tools/demo_trace.sh check

  usb:
    name: USB transports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - run: cargo test -p openlight-dmx --locked --features usb

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [show_load, gdtf_import, mvr_import, command_parse]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600
