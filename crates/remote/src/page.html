<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenLight remote</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #121417; color: #e8eaed; }
  header { display: flex; gap: 1rem; align-items: baseline; padding: 1rem 1.25rem; background: #1b1f24; }
  h1 { margin: 0; font-size: 1.2rem; letter-spacing: .04em; }
  #badges { color: #9aa4af; font-size: .9rem; }
  main { max-width: 900px; margin: auto; padding: 1.25rem; display: grid; gap: 1.25rem; }
  section { background: #1b1f24; border-radius: .5rem; padding: 1rem; }
  h2 { margin: 0 0 .75rem; font-size: .95rem; color: #9aa4af; text-transform: uppercase; letter-spacing: .08em; }
  #executors { display: flex; flex-wrap: wrap; gap: .6rem; }
  .executor { background: #252b32; border: 1px solid #39424c; padding: .6rem .75rem; border-radius: .4rem; min-width: 8rem; }
  .executor strong { display: block; margin-bottom: .2rem; }
  .executor small { color: #9aa4af; display: block; margin-bottom: .5rem; }
  button { background: #2f6fed; color: white; border: 0; border-radius: .3rem; padding: .45rem .65rem; cursor: pointer; margin-right: .3rem; }
  button.secondary { background: #39424c; }
  button:active { transform: translateY(1px); }
  #controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
  #command { display: flex; gap: .5rem; }
  #command input { flex: 1; background: #121417; color: #e8eaed; border: 1px solid #39424c; border-radius: .3rem; padding: .6rem; font: inherit; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85rem; max-height: 16rem; overflow: auto; }
  #tokenbox { display: flex; gap: .5rem; }
  #tokenbox input { flex: 1; background: #121417; color: #e8eaed; border: 1px solid #39424c; border-radius: .3rem; padding: .6rem; }
  .ok { color: #9be6a8; } .bad { color: #ff9d9d; }
</style>
</head>
<body>
<header><h1>OpenLight remote</h1><span id="badges">not connected</span></header>
<main>
  <section>
    <h2>Token</h2>
    <div id="tokenbox"><input id="token" type="password" autocomplete="off" placeholder="paste the token from remote.token"><button id="connect">Connect</button></div>
    <p><small>Kept in session storage only. The token file is printed by the console at start.</small></p>
  </section>
  <section><h2>Executors</h2><div id="executors">Connect to see the desk.</div></section>
  <section>
    <h2>Masters</h2>
    <div id="controls">
      <label>Grand <input id="grand" type="range" min="0" max="100" value="100"></label>
      <span id="grandValue">100%</span>
      <button id="blackout">Blackout</button>
    </div>
  </section>
  <section>
    <h2>Command</h2>
    <form id="command"><input id="line" placeholder="Go Executor 1" autocomplete="off"><button>Run</button></form>
    <div id="log"></div>
  </section>
</main>
<script>
const tokenInput = document.getElementById('token');
const connectButton = document.getElementById('connect');
const executors = document.getElementById('executors');
const log = document.getElementById('log');
const badges = document.getElementById('badges');
const grand = document.getElementById('grand');
const grandValue = document.getElementById('grandValue');
const blackout = document.getElementById('blackout');
let token = sessionStorage.getItem('openlight-token') || '';
let state = null;
let source = null;

function remember(value) {
  token = value.trim();
  sessionStorage.setItem('openlight-token', token);
}
function show(text, good = true) {
  const line = document.createElement('div');
  line.className = good ? 'ok' : 'bad';
  line.textContent = text;
  log.prepend(line);
}
function headers() { return {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}; }

async function run(line) {
  try {
    const response = await fetch('/command', {method: 'POST', headers: headers(), body: JSON.stringify({line})});
    const payload = await response.json();
    if (payload.error) show(payload.error, false);
    else (payload.lines || []).forEach(text => show(text));
    await refresh();
  } catch (error) {
    show(String(error), false);
  }
}

function render(next) {
  state = next;
  executors.replaceChildren();
  if (!next.executors.length) executors.textContent = 'No executors stored.';
  for (const executor of next.executors) {
    const box = document.createElement('div');
    box.className = 'executor';
    const title = document.createElement('strong');
    title.textContent = 'Executor ' + executor.number;
    const status = document.createElement('small');
    status.textContent = executor.state;
    const go = document.createElement('button');
    go.textContent = 'Go';
    go.onclick = () => run('Go Executor ' + executor.number);
    const back = document.createElement('button');
    back.className = 'secondary';
    back.textContent = 'Back';
    back.onclick = () => run('Back Executor ' + executor.number);
    box.append(title, status, go, back);
    executors.append(box);
  }
  badges.textContent = (next.blackout ? 'BLACKOUT' : 'live') + (next.blind ? ' · blind' : '') + (next.lock ? ' · locked' : '');
  grand.value = Math.round(next.grand * 100);
  grandValue.textContent = grand.value + '%';
  blackout.textContent = next.blackout ? 'Blackout Off' : 'Blackout';
}

async function refresh() {
  try {
    const response = await fetch('/state', {headers: {'Authorization': 'Bearer ' + token}});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    render(await response.json());
  } catch (error) {
    badges.textContent = 'not connected';
    show(String(error), false);
  }
}

function connect() {
  if (!token) { show('Paste the token first.', false); return; }
  remember(tokenInput.value || token);
  refresh();
  if (source) source.close();
  source = new EventSource('/events?token=' + encodeURIComponent(token));
  source.onmessage = event => {
    try { render(JSON.parse(event.data)); } catch (_) {}
  };
  source.onerror = () => { badges.textContent = 'reconnecting…'; };
}

connectButton.onclick = connect;
document.getElementById('command').onsubmit = event => {
  event.preventDefault();
  const input = document.getElementById('line');
  if (input.value.trim()) run(input.value.trim());
  input.value = '';
};
grand.oninput = () => { grandValue.textContent = grand.value + '%'; };
grand.onchange = () => run('Master Grand At ' + grand.value);
blackout.onclick = () => run(state && state.blackout ? 'Blackout Off' : 'Blackout');
tokenInput.value = token;
if (token) connect();
</script>
</body>
</html>
