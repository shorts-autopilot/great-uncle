[package]
publish = false
name = "openlight-console"
description = "OpenLight command line console"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "openlight"
path = "src/main.rs"

[dependencies]
openlight-app = { path = "../app" }
engine = { package = "openlight-engine", path = "../engine" }
remote = { package = "openlight-remote", path = "../remote" }
dmx = { package = "openlight-dmx", path = "../dmx" }
libc = "0.2"
