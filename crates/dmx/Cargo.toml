[package]
name = "openlight-dmx"
description = "DMX512 output transports: virtual, generic USB-serial, ENTTEC DMX USB Pro and uDMX"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dmx"

[dependencies]
thiserror = "2"
libc = "0.2"
rusb = { version = "0.9", features = ["vendored"], optional = true }

[features]
default = ["usb"]
usb = ["dep:rusb"]
