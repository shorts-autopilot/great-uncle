# cargo-deny: licences, advisories, duplicate versions and sources.
#
# The project is MIT. Every dependency must be compatible with that; the list
# below is the set the locked graph actually uses, with the common permissive
# alternatives rather than a blanket "anything goes".

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is reached through eframe's text stack (egui → epaint →
    # ab_glyph → owned_ttf_parser) and is marked unmaintained, not unsafe. The
    # window only parses the fonts compiled into epaint_default_fonts; there is
    # no newer parser in eframe 0.32 to move to.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    # libbz2-rs-sys, pulled in by zip's bzip2 support. Permissive and
    # GPL-compatible, with only an attribution requirement.
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path without repeating a
# version; that is intentional and not an unpinned registry dependency.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
